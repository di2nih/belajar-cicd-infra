name: Test Self-Hosted Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-job:
    runs-on: self-hosted
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          echo "Hello from Docker Self-Hosted Runner!"
          uname -a
          docker --version || echo "Docker CLI inside runner check"

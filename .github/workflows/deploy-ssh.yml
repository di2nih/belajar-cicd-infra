name: Deploy Infrastructure via SSH

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4

      - name: Execute Remote Commands via Native SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.TARGET_HOST }}
          USER: ${{ secrets.TARGET_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST << 'EOF'
            echo "=== Executing Deployment on Debian Target ==="
            hostname
            uptime
            uname -a
